<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#16201C">
<meta name="description" content="Mountain Kings : un village commun, un héros chacun.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mountain Kings">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Mountain Kings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Grenze+Gotisch:wght@600;700&display=swap">
<style>
/* Layout: full-screen 3D valley; a thin game HUD floats on top (identity + stock at the top, actions at the bottom), menus rise as bottom sheets. */
:root{
  --bg:#E8EDE9; --surface:#F6F8F5; --surface-2:#DCE4DE; --fg:#17231E; --muted:#55645C; --line:#C3CEC6;
  --accent:#2A684B; --accent-fg:#F3FAF6; --lantern:#AD6210; --lantern-soft:#F4E2C6; --danger:#A63D2C; --ok:#2B7449;
  --wood:#8B5A2B; --stone:#5F6E7B; --food:#9C7112; --shadow:rgba(23,35,30,.18);
  --gold:#A8750C; --iron:#5A6773; --r0:#69727D; --r1:#2D8649; --r2:#2A64C4; --r3:#8243C6; --r4:#BC5C16; --rs:#0F8670;
  --hud:rgba(246,248,245,.9);
  --font-display:"Grenze Gotisch","Palatino Linotype","Book Antiqua",Georgia,serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#16201C; --surface-2:#22302A; --fg:#E2EAE5; --muted:#93A49A; --line:#2E3D36;
    --accent:#6CBB91; --accent-fg:#0B1712; --lantern:#F0A548; --lantern-soft:#3A2B16; --danger:#EE8A75; --ok:#73C597;
    --wood:#D49C63; --stone:#A8B6C2; --food:#E3BC5C; --shadow:rgba(0,0,0,.5); --hud:rgba(22,32,28,.9); color-scheme:dark;
    --gold:#F2C14E; --iron:#AEBBC7; --r0:#B4BCC6; --r1:#6FD38C; --r2:#86B7FF; --r3:#C9A0FF; --r4:#FFAD5C; --rs:#4FD8BF;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#16201C; --surface-2:#22302A; --fg:#E2EAE5; --muted:#93A49A; --line:#2E3D36;
  --accent:#6CBB91; --accent-fg:#0B1712; --lantern:#F0A548; --lantern-soft:#3A2B16; --danger:#EE8A75; --ok:#73C597;
  --wood:#D49C63; --stone:#A8B6C2; --food:#E3BC5C; --shadow:rgba(0,0,0,.5); --hud:rgba(22,32,28,.9); color-scheme:dark;
  --gold:#F2C14E; --iron:#AEBBC7; --r0:#B4BCC6; --r1:#6FD38C; --r2:#86B7FF; --r3:#C9A0FF; --r4:#FFAD5C; --rs:#4FD8BF;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.4;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
h1,h2,h3,p{margin:0}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#9cc6e8}
.ic{display:inline-flex;width:18px;height:18px;flex:none}
.ic svg{width:100%;height:100%}
.c-or{color:var(--gold)} .c-fer{color:var(--iron)}
.c-bois{color:var(--wood)} .c-pierre{color:var(--stone)} .c-vivres{color:var(--food)} .c-army{color:var(--danger)} .c-tro{color:var(--lantern)}

/* HUD */
.hud{position:fixed;left:0;right:0;z-index:5;pointer-events:none;display:grid;gap:8px;padding-inline:16px;max-width:620px;margin:0 auto}
.hud > *{pointer-events:auto}
.hud.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
.hud.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.glass{background:var(--hud);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 22px var(--shadow)}
.idrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.me{appearance:none;border:0;font:inherit;color:inherit;display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;cursor:pointer;min-width:0;max-width:62%}
.crest{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.idtxt{display:grid;min-width:0;text-align:left}
.idtxt b{font-family:var(--font-display);font-size:21px;line-height:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idtxt small{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:4px}
.idtxt small .ic{width:13px;height:13px}
.chips{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:40%}
.chipb{appearance:none;font:inherit;display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:11.5px;font-weight:800;color:var(--fg);cursor:pointer;white-space:nowrap}
.chipb .ic{width:14px;height:14px}
.chipb.alert{background:var(--danger);color:#fff;border-color:transparent}
.chipb.live .dot{width:7px;height:7px;border-radius:50%;background:#3ccf73;box-shadow:0 0 0 2px rgba(60,207,115,.25)}
.stock{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.pill .fill.none{visibility:hidden}
.pill{padding:6px 8px 7px;display:grid;gap:3px;min-width:0}
.pill .v{display:flex;align-items:center;gap:5px;font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.pill .v small{font-size:10.5px;color:var(--muted);font-weight:700}
.pill .fill{height:4px;border-radius:3px;background:color-mix(in srgb,var(--fg) 12%,transparent);overflow:hidden}
.pill .fill i{display:block;height:100%;background:currentColor;border-radius:3px}
.pill.full .v{color:var(--lantern)}

.nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:5px}
.nav button{appearance:none;border:0;background:transparent;color:var(--fg);font:inherit;font-size:11px;font-weight:800;display:grid;justify-items:center;gap:3px;padding:7px 2px 6px;border-radius:10px;cursor:pointer;position:relative;min-height:54px}
.nav button .ic{width:24px;height:24px}
.nav button.hot{background:var(--accent);color:var(--accent-fg)}
.nav button:focus-visible,.btn:focus-visible,.chipb:focus-visible,.me:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}
.nav .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--lantern);box-shadow:0 0 0 2px var(--surface)}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:800;font-size:14px;border-radius:11px;padding:9px 12px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation;transition:transform .08s ease}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.warn{background:var(--lantern);border-color:var(--lantern);color:#fff}
.btn.off{opacity:.5}
.btn:active:not(.off){transform:translateY(1px) scale(.98)}
.btn .sub{font-weight:700;font-size:12px;opacity:.9;display:inline-flex;align-items:center;gap:3px}
.btn .sub .ic{width:14px;height:14px}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.split{justify-content:space-between}
.grow{flex:1}

.card{padding:12px 14px;display:grid;gap:8px}
.card h3{font-size:17px;font-weight:800;display:flex;align-items:baseline;gap:8px;justify-content:space-between;flex-wrap:wrap}
.card h3 small{font-size:12px;font-weight:700;color:var(--muted)}
.card.tip{gap:8px;border-left:4px solid var(--lantern);padding:10px 12px}
.card.tip .tiptxt{display:flex;gap:8px;align-items:flex-start;text-align:left;font-size:13.5px;line-height:1.38;margin:0}
.card.tip .tiptxt .ic{flex:none;margin-top:1px}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 5px;border-radius:999px;background:var(--surface-2);font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .ic{width:14px;height:14px}
.chip.short{color:var(--danger);background:color-mix(in srgb,var(--danger) 13%,transparent)}
.chip.plus{color:var(--ok)}
.chips2{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.bar{height:8px;border-radius:5px;background:color-mix(in srgb,var(--fg) 12%,transparent);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lantern);border-radius:5px;transition:width .9s linear}
.why{font-size:12.5px;color:var(--danger);font-weight:700}
.x{appearance:none;border:0;background:var(--surface-2);color:var(--fg);width:34px;height:34px;border-radius:10px;font-size:18px;font-weight:800;cursor:pointer;display:grid;place-items:center;flex:none}

/* feuille du bas */
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,620px);z-index:20;max-height:82%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -14px 50px var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.sheet-head h2{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1}
.sheet-body{overflow-y:auto;overflow-x:hidden;padding:2px 16px 22px;display:grid;gap:12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sec{display:grid;gap:8px}
.sec > h4{margin:6px 0 0;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.item{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:7px;background:var(--surface)}
.item.feature{border-color:color-mix(in srgb,var(--lantern) 45%,var(--line));background:linear-gradient(180deg,var(--lantern-soft),var(--surface) 75%)}
.item .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.item .head b{font-size:16px}
.item .head small{font-size:12.5px;color:var(--muted);font-weight:700}
.item p{font-size:13px;color:var(--muted)}
.item .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dur{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;color:var(--muted);font-weight:700}
.dur .ic{width:14px;height:14px}
.log{list-style:none;margin:0;padding:0;display:grid}
.log li{display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.log li:first-child{border-top:0}
.log time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stars{display:inline-flex;gap:2px;align-items:center}
.stars .ic{width:18px;height:18px}
.st-on{color:#F2B632} .st-off{color:color-mix(in srgb,var(--fg) 25%,transparent)}
details.help{font-size:13.5px;color:var(--muted)}
details.help summary{cursor:pointer;font-weight:800;color:var(--fg);padding-block:6px}
details.help ul{margin:6px 0 0;padding-left:18px;display:grid;gap:5px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .btn{width:40px;min-height:38px;padding:0;font-size:18px}
.stepper .n{min-width:56px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.troop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.tico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg)}
.tico .ic{width:28px;height:28px}
.stats{font-size:12.5px;color:var(--muted);font-weight:600}

/* combat */
.bt-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px}
.bt-top .nm{display:grid;min-width:0}
.bt-top .nm b{font-family:var(--font-display);font-size:20px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-top .nm small{font-size:11.5px;color:var(--muted);font-weight:700}
.score{display:flex;align-items:center;gap:8px;font-weight:800;font-variant-numeric:tabular-nums}
.score .pct{font-size:18px;white-space:nowrap}
.score{flex:none}
.score .time{font-size:13px;padding:3px 7px;border-radius:8px;background:var(--surface-2)}
/* Barre de déploiement compacte : vignettes + pastille du nombre, ×5, fin. */
.fightwrap{display:grid;justify-items:center;gap:5px;min-width:0}
.hud > .fightwrap{pointer-events:none}
.fightwrap > .fightbar{pointer-events:auto}
.ftip{pointer-events:none;font-size:12px;font-weight:800;color:#fff;background:rgba(24,18,11,.6);padding:4px 11px;border-radius:999px;text-align:center;max-width:100%;text-wrap:balance}
.fightbar{display:flex;align-items:center;gap:4px;padding:3px;max-width:100%;min-width:0;border-radius:15px}
.troopbar{display:flex;gap:4px;overflow-x:auto;align-items:center;min-width:0;padding:2px;scrollbar-width:none;overscroll-behavior:contain}
.troopbar::-webkit-scrollbar{display:none}
.tbtn{appearance:none;border:2px solid transparent;background:transparent;color:var(--fg);font:inherit;border-radius:12px;padding:0;display:grid;place-items:center;cursor:pointer;font-weight:800;position:relative;flex:none;touch-action:manipulation}
.tbtn .thumb.sm{width:40px;height:40px;border-radius:10px;box-shadow:inset 0 0 0 2px rgba(122,85,52,.35)}
.tbtn .thumb.sm.hero{box-shadow:inset 0 0 0 2px #c9922e}
.tbtn .n{position:absolute;right:-3px;bottom:-3px;min-width:19px;height:18px;padding:0 4px;border-radius:9px;background:#2a2017;color:#fff;font-size:11.5px;line-height:18px;font-variant-numeric:tabular-nums;display:grid;place-items:center;box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.tbtn .n .ic{width:12px;height:12px}
.tbtn .n.pw{background:#f0b443;color:#3a2506}
.tbtn .n.ko{background:var(--danger);font-size:9.5px}
.tbtn.on{border-color:var(--lantern);background:var(--lantern-soft)}
.tbtn.empty{opacity:.45}
.tbtn.power{border-color:#e8b14a;animation:glowp 1.2s ease-in-out infinite}
.tbtn.grp{width:44px;height:44px;background:var(--surface-2);border-color:var(--line);align-content:center;gap:1px}
.tbtn.grp b{font-size:15px;line-height:1;font-variant-numeric:tabular-nums}
.tbtn.grp small{font-size:9.5px;line-height:1;color:var(--muted);font-weight:800}
.fightbar .rnote{font-size:12.5px;font-weight:700;color:var(--muted);padding:0 6px 0 9px;max-width:300px;line-height:1.25}
.btn.fend{flex:none;max-width:104px;min-height:44px;padding:4px 10px;font-size:12.5px;line-height:1.12;text-align:center;white-space:normal;text-wrap:balance}
@keyframes glowp{0%,100%{box-shadow:0 0 0 0 rgba(232,177,74,.0)}50%{box-shadow:0 0 0 5px rgba(232,177,74,.45)}}
/* Vignettes des troupes et des héros */
.thumb{position:relative;width:56px;height:56px;border-radius:14px;flex:none;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 30%,#fff3d6 0%,#ecd3a0 55%,#c69a5a 100%);box-shadow:inset 0 0 0 2px rgba(122,85,52,.35),0 2px 6px var(--shadow);color:#7a5534}
.thumb .ic{width:28px;height:28px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;pointer-events:none}
.thumb.hero{background:radial-gradient(circle at 50% 30%,#fff6dc 0%,#f2c96a 55%,#b9802a 100%);box-shadow:inset 0 0 0 2px #c9922e,0 2px 8px rgba(201,146,46,.45)}
.thumb.sm{width:40px;height:40px;border-radius:10px}
.thumb.sm .ic{width:22px;height:22px}
.hero-card .pm{font-size:13px;color:var(--fg)}
.hero-card .pm .plus,.item .pm .plus{color:var(--ok)} .item .pm .minus{color:var(--danger)}
.item .pm{font-size:13px}
.pw{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--fg)}
.pw .ic{width:16px;height:16px;margin-top:2px}
.helpb{padding:5px 7px}
.helpb .ic{width:17px;height:17px}
.range{width:100%;accent-color:var(--lantern)}
.news{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.news li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--fg)}
.news .ic{width:22px;height:22px;flex:none;margin-top:1px}
.bigstars .pop{animation:starpop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starpop{0%{transform:scale(0) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
/* Tutoriel */
.tuto{position:absolute;inset:0;z-index:60}
.tuto.dim{background:rgba(8,12,10,.58)}
.tuto-hole{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(8,12,10,.58),inset 0 0 0 3px var(--lantern);pointer-events:none;transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease}
.tuto-card{position:absolute;padding:14px 16px;display:grid;gap:8px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 50px var(--shadow)}
.tuto-card h3{font-family:var(--font-display);font-size:25px;line-height:1.05;font-weight:700}
.tuto-card p{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){ .tbtn.power,.bigstars .pop{animation:none} .tuto-hole{transition:none} }
.tip{font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;padding:4px 8px}

/* modales */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(10,16,14,.45)}
.mcard{width:min(420px,100%);max-height:92%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px;box-shadow:0 24px 60px var(--shadow)}
.mcard h2{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.02;text-wrap:balance;overflow-wrap:anywhere}
.mcard p{color:var(--muted);font-size:14.5px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--lantern)}
.mcard label{display:grid;gap:6px;font-weight:800;font-size:13.5px}
.mcard input[type=text]{font:inherit;font-size:16px;font-weight:500;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;-webkit-user-select:text;user-select:text}
.mcard input[type=text]:focus-visible{outline:3px solid var(--lantern);outline-offset:1px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{position:relative;display:block}
.swatches input{position:absolute;opacity:0;width:36px;height:36px;margin:0;cursor:pointer}
.swatches span{display:block;width:36px;height:36px;border-radius:10px;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked + span{box-shadow:0 0 0 3px var(--fg)}
.swatches input:focus-visible + span{outline:3px solid var(--lantern);outline-offset:2px}
.bigstars{display:flex;justify-content:center;gap:6px}
.bigstars .ic{width:52px;height:52px}
.result-pct{text-align:center;font-weight:800;font-size:15px;color:var(--muted)}
.err{color:var(--danger);font-weight:700;font-size:13.5px}
.mcard h2.title{font-size:46px;letter-spacing:.01em;color:var(--fg)}
.land .mcard h2.title{font-size:40px}
.btn[disabled]{opacity:.6;pointer-events:none}
.invite{padding:12px 14px;display:grid;gap:10px;border-color:color-mix(in srgb,var(--lantern) 60%,var(--line))}
.invite b{font-size:15px}
.center{display:grid;place-items:center;text-align:center}
.loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;padding:12px 18px;font-weight:800}
